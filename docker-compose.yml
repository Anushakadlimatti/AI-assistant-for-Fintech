version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ai-banking-db
    restart: always
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
